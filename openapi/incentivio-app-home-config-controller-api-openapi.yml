          type: string
        stagedDefaultVideoImageUrl:
          type: string
        previewUsers:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/BackgroundPreviewDTO'
    BackgroundScheduleDTO:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        imageUrlAndroid:
          type: string
        imageUrlIos:
          type: string
        videoUrlAndroid:
          type: string
        videoUrlIos:
          type: string
        videoImageUrl:
          type: string
        startDate:
          type: string
        endDate:
          type: string
        startTime:
          type: string
        endTime:
          type: string
        daysOfWeek:
          type: array
          items:
            type: string
        enabled:
          type: boolean
    AppHomeConfigDTO:
      type: object
      properties:
        clientId:
          type: string
        version:
          type: integer
          format: int32
        background:
          $ref: '#/components/schemas/HomeBackgroundDTO'
        blocks:
          type: array
          items: {}
        previewScheduleId:
          type: string
        previewType:
          type: string
        hasStagedDefault:
          type: boolean
    DefaultBackgroundRequestDTO:
      type: object
      properties:
        imageUrlAndroid:
          type: string
        imageUrlIos:
          type: string
        videoUrlAndroid:
          type: string
        videoUrlIos:
          type: string
        videoImageUrl:
          type: string
    PreviewRequestDTO:
      type: object
      properties:
        userId:
          type: string
        type:
          type: string
        scheduleId:
          type: string
      required:
      - type
      - userId
    AppHomeConfigAuditDTO:
      type: object
      properties:
        id:
          type: string
        adminId:
          type: string
        action:
          type: string
        detail:
          type: string
        timestamp:
          type: string
          format: date-time
    BackgroundScheduleRequestDTO:
      type: object
      properties:
        label:
          type: string
        imageUrlAndroid:
          type: string
        imageUrlIos:
          type: string
        videoUrlAndroid:
          type: string
        videoUrlIos:
          type: string
        videoImageUrl:
          type: string
        startDate:
          type: string
        endDate:
          type: string
        startTime:
          type: string
        endTime:
          type: string
        daysOfWeek:
          type: array
          items:
            type: string
        enabled:
          type: boolean
      required:
      - enabled
      - endDate
      - endTime
      - startDate
      - startTime
    BackgroundPreviewDTO:
      type: object
      properties:
        type:
          type: string
        scheduleId:
          type: string
    AppHomeConfigDTO_2:
      type: object
      properties:
        clientId:
          type: string
        version:
          type: integer
          format: int32
        background:
          $ref: '#/components/schemas/HomeBackgroundDTO'
        blocks:
          type: array
          items:
            type: object
        previewScheduleId:
          type: string
        previewType:
          type: string
        hasStagedDefault:
          type: boolean
