components:
  schemas:
    HomeBackgroundDTO:
      type: object
      properties:
        defaultImageUrlAndroid:
          type: string
        defaultImageUrlIos:
          type: string
        defaultVideoUrlAndroid:
          type: string
        defaultVideoUrlIos:
          type: string
        defaultVideoImageUrl:
          type: string
        schedules:
          type: array
          items:
            $ref: '#/components/schemas/BackgroundScheduleDTO'
        stagedDefaultImageUrlAndroid:
          type: string
        stagedDefaultImageUrlIos:
          type: string
        stagedDefaultVideoUrlAndroid:
          type: string
