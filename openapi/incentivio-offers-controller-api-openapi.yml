        externalId:
          type: string
        priority:
          type: integer
          format: int32
        redemptionStartDate:
          type: string
        redemptionEndDate:
          type: string
        distributionStartDate:
          type: string
        distributionEndDate:
          type: string
        distributionMode:
          type: string
          enum:
          - AUTO
          - MANUAL
          - ACTIVITY
          - PURCHASE_ACTIVITY
          - POINTS_ACTIVITY
        displayInfo:
          type: array
          items:
            $ref: '#/components/schemas/DisplayInfo'
        merchantId:
          type: string
        codeType:
          type: string
          enum:
          - FIXED
          - VARIABLE
        codeFormat:
          type: string
        offerCode:
          type: string
        distributionRuleSet:
          type: string
        redemptionRuleSet:
          type: string
        createdDate:
          type: string
        updatedDate:
          type: string
        isLoyaltyOffer:
          type: boolean
        offerRedemptionExpired:
          type: boolean
    ActivityContentRequestDTO:
      type: object
      properties:
        userId:
          type: string
        clientId:
          type: string
        languageCode:
          type: string
        merchantId:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        events:
          type: object
