openapi: 3.2.0
info:
  title: OpenAPI definition Sub Item Controller API
  version: v0
servers:
- url: https://adminapi.incentivio.com/incentivio-admin-api
  description: Generated server url
tags:
- name: sub-item-controller
paths:
  /incentivio-ordering-service/subitems:
    put:
      tags:
      - sub-item-controller
      operationId: addOrUpdatePackage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubItemRequestDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CreateSubItemResponseDTO'
      summary: Add or update package
      x-summary-source: derived
  /incentivio-ordering-service/adminsubitems:
    get:
      tags:
      - sub-item-controller
      operationId: listSubItemsByClientIdAndItemIdForAdmin
      parameters:
      - name: itemid
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ListSubItemResponseAdminDTO'
      summary: List sub items by client id and item id for admin
      x-summary-source: derived
  /incentivio-ordering-service/adminsubitems/{subitemid}:
    get:
      tags:
      - sub-item-controller
      operationId: viewSubItemByIdForAdmin
      parameters:
      - name: subitemid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ViewSubItemResponseAdminDTO'
      summary: View sub item by id for admin
      x-summary-source: derived
  /incentivio-ordering-service/subitems/{subitemid}:
    delete:
      tags:
      - sub-item-controller
      operationId: deleteSubItems
      parameters:
      - name: subitemid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
      summary: Delete sub items
      x-summary-source: derived
