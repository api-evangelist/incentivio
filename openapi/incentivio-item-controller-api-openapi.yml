openapi: 3.2.0
info:
  title: OpenAPI definition Item Controller API
  version: v0
servers:
- url: https://adminapi.incentivio.com/incentivio-admin-api
  description: Generated server url
tags:
- name: item-controller
paths:
  /incentivio-ordering-service/items:
    put:
      tags:
      - item-controller
      operationId: addOrUpdateItem
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateItemRequestDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CreateItemResponseDTO'
      summary: Add or update item
      x-summary-source: derived
    patch:
      tags:
      - item-controller
      operationId: patchItems
      parameters:
      - name: storeId
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkUpdateRequest'
        required: true
      responses:
        '200':
          description: OK
      summary: Patch items
      x-summary-source: derived
  /incentivio-ordering-service/items/list:
    post:
      tags:
      - item-controller
      operationId: listItems
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemSearchRequestDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ListItemResponseWithPagingForAdminDTO'
      summary: List items
      x-summary-source: derived
  /incentivio-ordering-service/items/delete:
    post:
      tags:
      - item-controller
      operationId: deleteItems
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
        required: true
      responses:
        '200':
          description: OK
      summary: Delete items
      x-summary-source: derived
  /incentivio-ordering-service/item/{itemId}:
    patch:
      tags:
      - item-controller
      operationId: patchItem
      parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: string
      - name: storeId
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/PatchRequestDTO'
        required: true
      responses:
        '200':
          description: OK
      summary: Patch item
      x-summary-source: derived
  /incentivio-ordering-service/adminitems:
    get:
      tags:
      - item-controller
      operationId: listItemByGroupAndTimeForAdmin
      parameters:
      - name: groupId
        in: query
        required: false
        schema:
          type: string
      - name: catalogId
        in: query
        required: false
        schema:
          type: string
      - name: title
        in: query
        required: false
        schema:
          type: string
      - name: count
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 300
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: incentivioIds
        in: query
        required: false
        schema:
          type: string
      - name: externalIds
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Status'
      - name: outOfStock
        in: query
        required: false
        schema:
          type: boolean
      - name: outOfStockToday
        in: query
        required: false
        schema:
          type: boolean
      - name: sortDirection
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Direction'
          default: ASC
      - name: sortBy
        in: query
        required: false
        schema:
          type: string
          default: title
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ListItemResponseWithPagingForAdminDTO'
      summary: List item by group and time for admin
      x-summary-source: derived
  /incentivio-ordering-service/adminitems/{itemid}:
    get:
      tags:
      - item-controller
      operationId: viewItemByIdForAdmin
      parameters:
      - name: itemid
        in: path
        required: true
        schema:
          type: string
      - name: includeStores
        in: query
        required: false
        schema:
          type: boolean
      - name: includeChildElements
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ViewItemAdminDTO'
      summary: View item by id for admin
      x-summary-source: derived
  /incentivio-ordering-service/adminitems/downloadcsv:
    get:
      tags:
      - item-controller
      operationId: downloadItemsCSV
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
      summary: Download items CSV
      x-summary-source: derived
  /incentivio-ordering-service/adminitems/by-displayinfo-title:
    get:
      tags:
      - item-controller
      operationId: getItemsByDisplayInfoTitleForAdmin
      parameters:
      - name: displayInfoTitle
        in: query
        required: false
        schema:
          type: string
      - name: languageCode
        in: query
        required: false
        schema:
          type: string
      - name: itemType
        in: query
        required: false
        schema:
          type: string
      - name: count
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 300
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FindItemsDisplayInfoResponse'
      summary: Get items by display info title for admin
      x-summary-source: derived
  /incentivio-ordering-service/items/{itemid}:
    delete:
      tags:
      - item-controller
      operationId: deleteItem
      parameters:
      - name: itemid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
      summary: Delete item
      x-summary-source: derived
