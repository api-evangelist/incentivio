openapi: 3.2.0
info:
  title: Incentivio Ml Controller API
  version: v0
  description: 'Operations tagged ml-controller across 2 of this provider''s published API definitions: incentivio-admin-api-openapi.yml, incentivio-mobile-api-openapi.yml. Each path carries the servers of the definition it was published in.'
