components:
  schemas:
    CreateRuleRequest:
      type: object
      properties:
        clientId:
          type: string
        rules:
          type: array
          items:
            $ref: '#/components/schemas/RuleRequest'
    CreateRuleResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        ruleCount:
          type: integer
          format: int32
    CategoryChangedItemResponse:
      type: object
      properties:
        clientId:
          type: string
        itemName:
          type: string
        category:
          type: string
        subCategory:
          type: string
        previousCategory:
          type: string
        previousSubCategory:
          type: string
    RuleRequest:
      type: object
      properties:
        ruleId:
          type: string
        ruleType:
          type: string
        triggerMenus:
          type: array
          items:
            type: string
        triggerGroups:
          type: array
          items:
            type: string
        triggerItems:
          type: array
          items:
            type: string
        recommendationItems:
          type: array
          items:
            type: string
        metaData:
          $ref: '#/components/schemas/AdminPortalMetaDataRequest'
    DeleteRuleRequest:
      type: object
      properties:
        ruleId:
          type: string
        clientId:
          type: string
        metaData:
          $ref: '#/components/schemas/AdminPortalMetaDataRequest'
    AdminPortalMetaDataRequest:
      type: object
      properties:
        deviceDetail:
          $ref: '#/components/schemas/DeviceDetailRequest'
        userDetail:
          $ref: '#/components/schemas/UserDetailRequest'
    UpdateConfigurationRequest:
      type: object
      properties:
        clientId:
          type: string
        mainCount:
          type: integer
          format: int32
        sideCount:
          type: integer
          format: int32
        beverageCount:
          type: integer
          format: int32
        dessertCount:
          type: integer
          format: int32
        maxRuleRecommendations:
          type: integer
          format: int32
        maxRecommendations:
          type: integer
          format: int32
        metaData:
          $ref: '#/components/schemas/AdminPortalMetaDataRequest'
    UpdatedConfigurationResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        newSideCount:
          type: integer
          format: int32
        newBeverageCount:
          type: integer
          format: int32
        newDessertCount:
          type: integer
          format: int32
        newMaxRuleRecommendations:
          type: integer
          format: int32
        newMaxRecommendations:
          type: integer
          format: int32
    ItemCategoryChaingingRequest:
      type: object
      properties:
        clientId:
          type: string
        itemName:
          type: string
        category:
          type: string
        subCategory:
          type: string
        previousCategory:
          type: string
        previousSubCategory:
          type: string
        metaData:
          $ref: '#/components/schemas/AdminPortalMetaDataRequest'
    DeviceDetailRequest:
      type: object
      properties:
        deviceIpAddress:
          type: string
        deviceType:
          type: string
        browserType:
          type: string
    DeleteRuleResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
    StartTrainingProcessResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
    UserDetailRequest:
      type: object
      properties:
        userId:
          type: string
        userName:
          type: string
        email:
          type: string
    ModelTrainingRequest:
      type: object
      properties:
        clientId:
          type: string
        clientName:
          type: string
        metaData:
          $ref: '#/components/schemas/AdminPortalMetaDataRequest'
    LocationDetailRequest:
      type: object
      properties:
        locationId:
          type: string
        locationName:
          type: string
        metaData:
          $ref: '#/components/schemas/AdminPortalMetaDataRequest'
        locationEnabled:
          type: boolean
    UpdateLocationResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        updatedLocationsCount:
          type: integer
          format: int32
    UpdateLocationRequest:
      type: object
      properties:
        clientId:
          type: string
        locations:
          type: array
          items:
            $ref: '#/components/schemas/LocationDetailRequest'
