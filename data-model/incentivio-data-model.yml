name: Incentivio data model
description: >-
  Entity graph derived from the id-reference fields and $ref links in Incentivio's
  two OpenAPI definitions. The model is strictly hierarchical and tenant-rooted:
  a Client (a restaurant brand) owns Merchants, which own Locations/Stores, which
  carry Catalogs; a User places Orders at a Location, and Loyalty, Offers, Gift
  Cards and Wallets hang off the User-Client pair. clientId is the most common
  field in both definitions (37 schemas on the mobile side, 79 on the admin side),
  which is the model saying out loud that nothing exists outside a brand.
id_style:
  format: opaque string
  prefixes: none
  note: >-
    No typed or prefixed identifiers (no cus_/ord_ style). Ids are bare strings,
    and the same logical entity is referred to as both `id` and `<entity>Id`
    depending on the schema. `externalId` appears on 13 mobile and 29 admin
    schemas — the hook by which POS, loyalty and payment systems map their own
    keys onto Incentivio records.
entities:
  - name: Client
    key: clientId
    description: >-
      The restaurant brand tenant. Root of the entire model and required on
      practically every call, as a CLIENTID / Inc-Client-Id header or a clientid
      path parameter.
    schemas: [ClientConfig, ClientDomain, ClientAlias]
  - name: Merchant
    key: merchantId
    description: A billing/operating entity under a Client.
  - name: Location
    key: locationId
    description: A physical restaurant. Carries WorkingHours, Address and OrderValueLimits.
    schemas: [WorkingHours, Address, OrderValueLimits]
  - name: Store
    key: storeId
    description: >-
      The ordering/reporting projection of a Location. The admin reporting surface
      filters almost entirely by storeIds.
    schemas: [StoreInfo]
  - name: Catalog
    key: catalogId
    description: A menu. Cached and compressed variants are served to clients.
  - name: Category
    key: categoryId
    description: A menu section within a Catalog.
  - name: Item
    key: itemId
    description: A menu item, with sub-items and modifiers.
  - name: User
    key: userId
    description: >-
      A guest account. Created by email, SMS, external/social identity or
      passwordless flow.
  - name: Customer
    key: customerId
    description: >-
      The marketing-side view of a guest, used by segments, tags and journeys —
      the admin counterpart of User.
  - name: Order
    key: orderId
    description: A guest order. Carries OrderItems, charges, taxes and payments.
    schemas: [ViewOrderResponseDTO, OrderUpdateSummaryDTO, TaxSummary, ChargeSummary]
  - name: OrderItem
    key: orderItemId
    description: A line on an Order.
    schemas: [OrderItem, AddOrderItemReqDTO]
  - name: PaymentInstrument
    key: paymentInstrumentId
    description: A stored payment method for a User.
    schemas: [PaymentRequestDTO]
  - name: LoyaltyAccount
    key: null
    description: >-
      A guest's loyalty balance and history for a Client. Keyed by the user/client
      pair rather than its own id; supports an external loyalty id and a loyalty
      card id.
  - name: Offer
    key: offerId
    description: A promotion. Distributed instances carry distributedOfferId.
  - name: DistributedOffer
    key: distributedOfferId
    description: An Offer issued to a specific guest.
  - name: GiftCard
    key: null
    description: >-
      Stored-value card. Purchased (purchaseECard), viewed (mygiftcard) and, on
      the admin side, issued, ACH-funded and reported on.
  - name: Wallet
    key: null
    description: Guest wallet balance.
  - name: Segment
    key: null
    description: A guest segment. Admin side adds segment tags and rules.
  - name: Persona
    key: null
    description: Admin-side guest persona used to drive guest journeys.
  - name: GuestJourney
    key: null
    description: A multi-step marketing journey with its own report surface.
  - name: Campaign
    key: null
    description: An email/SMS marketing campaign.
  - name: Message
    key: messageId
    description: >-
      An in-app or push message. Distributed instances carry distributedMessageId;
      multilingual variants are first class.
  - name: Survey
    key: surveyId
    description: A guest survey with submitted answers.
  - name: Transaction
    key: null
    description: Financial/loyalty transaction history for a guest.
  - name: Group
    key: groupId
    description: Grouping construct used for stores and offers.
  - name: Admin
    key: adminId
    description: >-
      An operator account in the admin console, bound to role/module permissions.
