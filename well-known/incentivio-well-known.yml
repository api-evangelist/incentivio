    role: website
  - host: https://apidocs.incentivio.com
    role: developer portal (Theneo)
  - host: https://mobile.incentivio.com/incentivio-mobile-api
    role: guest ordering API
  - host: https://adminapi.incentivio.com/incentivio-admin-api
    role: admin API
probes:
