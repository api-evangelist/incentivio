generated: '2026-08-13'
method: probed
source: live GET of /.well-known/* against every Incentivio host in apis.yml
name: Incentivio well-known probe
description: >-
  RFC 8615 well-known probe across Incentivio's website, developer portal and
  the two production API hosts. Two paths returned a real document: both API
  services publish RFC 8414 OAuth 2.0 Authorization Server Metadata anonymously,
  which is the only machine-readable authentication description Incentivio
  publishes anywhere. Everything else is a miss. Note that both the Theneo
  developer portal (apidocs.incentivio.com) and the ordering web app
  (order.incentivio.com) answer HTTP 200 with a single-page-app HTML shell for
  EVERY /.well-known/* path — those are recorded as misses, not hits, because the
  body is an HTML document and not the requested resource.
checked: '2026-08-13'
hosts:
