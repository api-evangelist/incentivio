name: Incentivio MCP server (candidate)
status: candidate
description: >-
  Incentivio ships no MCP server. Nothing was found on the company's site, its
  empty developer portal, its (empty) GitHub organization, npm, or PyPI, and no
  MCP endpoint responded on any Incentivio host. What follows is a CANDIDATE tool
  surface derived from real operationIds in the guest ordering API, recorded so
  the gap is legible and so a future server has a grounded starting point. None
  of these tools exists today.
deployment:
  mode: none
  endpoint: null
  install: null
  package: null
  auth: oauth
  verified: derived
